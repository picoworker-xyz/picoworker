# Netlify build + SPA config for the Vite app.
[build]
  command = "npm run build"
  publish = "dist"

# Public AdGem callback on our own domain. This is a reverse proxy (not a
# redirect), so AdGem receives the Edge Function's real HTTP status and retry
# behavior. The function reconstructs this public URL for HMAC verification.
[[redirects]]
  from = "/api/adgem/postback"
  to = "https://cgkccigqhecuxgklnqel.supabase.co/functions/v1/adgem-postback"
  status = 200
  force = true

# Paymentwall requires a public GET pingback URL that returns the Edge
# Function's exact status/body (not the SPA fallback).
[[redirects]]
  from = "/api/paymentwall/pingback"
  to = "https://cgkccigqhecuxgklnqel.supabase.co/functions/v1/paymentwall-pingback"
  status = 200
  force = true

# TaskWall authenticates this public GET callback with its postback password.
[[redirects]]
  from = "/api/taskwall/postback"
  to = "https://cgkccigqhecuxgklnqel.supabase.co/functions/v1/taskwall-postback"
  status = 200
  force = true

# Notik signs this public GET callback with a SHA1 HMAC over the full URL, so
# the function must see the exact path it was signed against and return its own
# status (they retry twice on anything but 200, then give up and email us).
[[redirects]]
  from = "/api/notik/postback"
  to = "https://cgkccigqhecuxgklnqel.supabase.co/functions/v1/notik-postback"
  status = 200
  force = true

# Junk left in search indexes by the domain's previous owner. Must return
# 410 Gone (not the SPA's 200) or Google keeps the URLs indexed.
# Order matters: these must sit above the /* catch-all, first match wins.
[[redirects]]
  from = "/maintenance-mode"
  to = "/index.html"
  status = 410

[[redirects]]
  from = "/html/*"
  to = "/index.html"
  status = 410

[[redirects]]
  from = "/slots/*"
  to = "/index.html"
  status = 410

[[redirects]]
  from = "/privacidade"
  to = "/index.html"
  status = 410

# Client-side application routes. Public information pages are emitted as real
# static files by the SEO generator and therefore do not need SPA fallbacks.
[[redirects]]
