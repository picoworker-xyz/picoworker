<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C10" />

    <!-- ===== Primary SEO ===== -->
    <title>PicoWorker — Complete Simple Online Tasks and Earn Rewards</title>
    <meta
      name="description"
      content="PicoWorker is a micro-task marketplace for simple online tasks. Follow accounts, watch clips, test apps, answer surveys and earn rewards for verified work. Free to join."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="PicoWorker" />
    <link rel="canonical" href="https://picoworker.xyz/" />

    <!-- ===== Icons / PWA ===== -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PicoWorker" />
    <!-- Brand mark: fetched once, reused everywhere -->
    <link rel="preload" as="image" href="/logo-mark.webp" />

    <!-- ===== Open Graph ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PicoWorker" />
    <meta property="og:title" content="PicoWorker — Simple Online Tasks and Rewards" />
    <meta
      property="og:description"
      content="Complete quick online tasks, explore offers and earn rewards for verified work. Free to join on mobile or desktop."
    />
    <meta property="og:url" content="https://picoworker.xyz/" />
    <meta property="og:image" content="https://picoworker.xyz/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PicoWorker — complete simple online tasks and earn rewards" />
    <meta property="og:locale" content="en_US" />

    <!-- ===== Twitter ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@picoworker" />
    <meta name="twitter:title" content="PicoWorker — Simple Online Tasks and Rewards" />
    <meta
      name="twitter:description"
      content="Complete quick online tasks, explore offers and earn rewards for verified work. Free to join."
    />
    <meta name="twitter:image" content="https://picoworker.xyz/og.png" />

    <!-- ===== Fonts ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts without blocking render: text paints immediately in a system
         font (display=swap) and swaps to the web font when it arrives. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- ===== Structured data: Organization ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PicoWorker",
        "alternateName": ["picoworker.xyz", "Pico Worker", "PicoWorker.xyz"],
        "url": "https://picoworker.xyz/",
        "logo": "https://picoworker.xyz/favicon.svg",
        "description": "A two-sided micro-task marketplace where people complete simple online tasks and businesses receive verified results.",
        "email": "hello@picoworker.xyz",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "hello@picoworker.xyz",
          "url": "https://picoworker.xyz/faq/"
        },
        "sameAs": [
          "https://x.com/picoworker",
          "https://whatsapp.com/channel/0029Vb83K7C3WHTNsVZmkn2k"
        ]
      }
    </script>

    <!-- ===== Structured data: WebSite ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PicoWorker",
        "alternateName": ["Pico Worker", "picoworker.xyz"],
        "url": "https://picoworker.xyz/"
      }
    </script>

    <!-- ===== Structured data: SoftwareApplication ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PicoWorker",
        "operatingSystem": "Web, iOS, Android",
        "applicationCategory": "BusinessApplication",
        "description": "Complete micro-tasks such as following accounts, watching clips, testing apps and answering surveys. Businesses can post tasks and review verified completions.",
        "offers": { "@type": "Offer", "description": "Free registration" }
      }
    </script>

    <!-- ===== Structured data: FAQ (mirrors on-page FAQ) ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is PicoWorker?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "PicoWorker is a micro-task marketplace where people complete small online tasks such as following accounts, watching clips, testing apps and answering surveys. Businesses post tasks and review verified results."
            }
          },
          {
            "@type": "Question",
            "name": "How do I earn rewards on PicoWorker?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sign up for free, choose an eligible task or offer, follow every requirement and wait for the completion to be verified."
            }
          },
          {
            "@type": "Question",
            "name": "How are task rewards decided?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Each task shows its reward and requirements before you begin. Availability and reward values can vary by country, device and provider."
            }
          },
          {
            "@type": "Question",
            "name": "When is a reward credited?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Eligible rewards are credited after PicoWorker or the offer provider confirms that every required step was completed."
            }
          },
          {
            "@type": "Question",
            "name": "Is PicoWorker free to join?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Registration and browsing available tasks are free."
            }
          },
          {
            "@type": "Question",
            "name": "Can businesses post tasks on PicoWorker?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Businesses can create permitted campaigns, define the required result and review submitted work before approval."
            }
          },
          {
            "@type": "Question",
            "name": "Is PicoWorker the same as Picoworkers or SproutGigs?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Picoworkers rebranded to SproutGigs and is a separate company. PicoWorker at picoworker.xyz is an independent marketplace for simple online tasks and verified rewards."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" role="status" aria-label="Loading PicoWorker" style="min-height:100svh;display:flex;align-items:center;justify-content:center;background:#0c0d11;color:#a9abb6;font:600 14px system-ui,sans-serif">
        Loading PicoWorker…
      </div>
    </div>
    <noscript>
      <div style="max-width: 680px; margin: 40px auto; padding: 24px; font-family: system-ui, sans-serif; color: #fff;">
        <h1>PicoWorker — complete simple online tasks and earn rewards</h1>
        <p>
          PicoWorker is a micro-task marketplace for small online tasks: follow accounts, watch clips,
          test apps and answer surveys. It is free to join, and businesses can post campaigns for
          verified results. Please enable JavaScript to use the app.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
