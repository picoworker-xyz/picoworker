    <!-- ===== Structured data: Organization ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is PicoWorker?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "PicoWorker is a micro-task marketplace where every small job pays in USDC. You follow accounts, watch videos, test apps and answer surveys, while businesses post the tasks and pay only for verified results."
            }
          },
          {
            "@type": "Question",
            "name": "How do I earn money on PicoWorker?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sign up for free, pick a task from the live feed and finish it in seconds. Most tasks verify automatically in about 10 seconds, and your USDC reward lands in your wallet instantly."
            }
          },
          {
            "@type": "Question",
            "name": "How much can I earn from micro-tasks?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Quick social tasks pay a few cents, while app tests and surveys pay $0.35 or more. Levels and streaks unlock up to 2x higher payouts, and referrals add even more on top."
            }
          },
          {
            "@type": "Question",
            "name": "When and how do I get paid?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You are paid in USDC the moment a task is verified. Cash out to any Solana wallet, or to Base and other networks, and withdrawals arrive in seconds for a fraction of a cent. PicoWorker is non-custodial: your keys, your USDC."
            }
          },
          {
            "@type": "Question",
            "name": "Is PicoWorker free to join?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, completely. Signing up and earning never costs a thing, and new earners receive a $0.05 welcome bonus on their first task."
            }
          },
          {
            "@type": "Question",
            "name": "Can businesses post tasks on PicoWorker?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely. Fund a campaign in USDC, set your reward and quantity, and reach real people for followers, views, installs and survey responses. Your budget sits safely in escrow and you only pay per verified completion."
            }
          }
        ]
      }
    </script>
